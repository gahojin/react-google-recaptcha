packages:
  - examples
  - packages/**

# 重複排除
dedupePeers: true

catalog:
  react: &react_ver 19.2.7
  react-dom: *react_ver
  playwright: 1.62.1
  rolldown: 1.2.2
  rolldown-plugin-dts: 0.28.0
  turbo: 2.10.8
  typescript: 7.0.2
  vite: 8.2.0
  vitest: &vitest_ver 4.1.10
  vitest-browser-react: 2.2.0
  '@biomejs/biome': 2.5.7
  '@fast-check/vitest': 0.4.1
  '@types/node': 26.1.2
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  '@vitejs/plugin-react': 6.0.5
  '@vitest/coverage-v8': *vitest_ver
  '@vitest/browser-playwright': *vitest_ver
  '@vitest/expect': *vitest_ver
  '@vitest/mocker': *vitest_ver
  '@vitest/spy': *vitest_ver

overrides:
  # CVE-2026-67213
  nanoid: ^3.3.17
  rolldown: 'catalog:'
  '@vitest/expect': 'catalog:'
  '@vitest/mocker': 'catalog:'
  '@vitest/spy': 'catalog:'

# リリースから一定時間経過していないか、信頼性低下したパッケージはインストールしない
minimumReleaseAge: 2880 # 2d
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade

# 特殊なソースからの依存関係をインストールしない
blockExoticSubdeps: true
