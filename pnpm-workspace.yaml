packages:
  - examples
  - packages/**

# 重複排除
dedupePeers: true

catalog:
  react: &react_ver 19.3.0
  react-dom: *react_ver
  playwright: 1.65.0
  rolldown: 1.3.0
  rolldown-plugin-dts: 0.29.0
  turbo: 2.11.10
  typescript: 7.0.2
  vite: 8.3.6
  vitest: &vitest_ver 5.1.0
  vitest-browser-react: 2.3.0
  '@biomejs/biome': 2.6.5
  '@fast-check/vitest': 0.5.0
  '@types/node': 26.6.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.2.1
  '@vitest/coverage-v8': *vitest_ver
  '@vitest/browser-playwright': *vitest_ver
  '@vitest/expect': *vitest_ver
  '@vitest/mocker': *vitest_ver
  '@vitest/spy': *vitest_ver

overrides:
  rolldown: 'catalog:'
  '@vitest/expect': 'catalog:'
  '@vitest/mocker': 'catalog:'
  '@vitest/spy': 'catalog:'

# リリースから一定時間経過していないか、信頼性低下したパッケージはインストールしない
minimumReleaseAge: 2880 # 2d
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade

# 特殊なソースからの依存関係をインストールしない
blockExoticSubdeps: true
